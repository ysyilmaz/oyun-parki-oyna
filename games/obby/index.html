<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2f8cff">
<title>Gökyüzü Parkuru</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"../../vendor/three/build/three.module.js","three/addons/":"../../vendor/three/jsm/","postprocessing":"../../vendor/postprocessing/postprocessing.min.js"}}</script>
</head>
<body>
<canvas id="scene"></canvas>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-coin" viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="#f7a400"/><circle cx="24" cy="24" r="17" fill="#ffcf2e"/><path d="M24 12l3.6 7.4 8.1 1.2-5.9 5.7 1.4 8.1L24 30.6l-7.2 3.8 1.4-8.1-5.9-5.7 8.1-1.2z" fill="#ffe98a" stroke="#e58f00" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-clock" viewBox="0 0 48 48"><circle cx="24" cy="26" r="18" fill="#fff" stroke="#27324a" stroke-width="5"/><path d="M24 16v11l7 4" stroke="#27324a" stroke-width="5" fill="none" stroke-linecap="round"/><rect x="19" y="3" width="10" height="6" rx="3" fill="#27324a"/></symbol>
    <symbol id="i-skull" viewBox="0 0 48 48"><path d="M24 5C13 5 6 12.5 6 22c0 6 3 10 7 12v6c0 1.7 1.3 3 3 3h16c1.7 0 3-1.3 3-3v-6c4-2 7-6 7-12C42 12.5 35 5 24 5z" fill="#fff" stroke="#27324a" stroke-width="4"/><circle cx="17" cy="23" r="5" fill="#27324a"/><circle cx="31" cy="23" r="5" fill="#27324a"/><path d="M21 38v-5M27 38v-5" stroke="#27324a" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="i-sound" viewBox="0 0 48 48"><path d="M8 18h8l11-9v30l-11-9H8z" fill="#fff" stroke="#27324a" stroke-width="4" stroke-linejoin="round"/><path d="M33 17c3 4 3 10 0 14M38 12c6 7 6 17 0 24" stroke="#27324a" stroke-width="4" fill="none" stroke-linecap="round"/></symbol>
    <symbol id="i-mute" viewBox="0 0 48 48"><path d="M8 18h8l11-9v30l-11-9H8z" fill="#fff" stroke="#27324a" stroke-width="4" stroke-linejoin="round"/><path d="M33 18l10 12M43 18L33 30" stroke="#e8334a" stroke-width="5" stroke-linecap="round"/></symbol>
    <symbol id="i-pause" viewBox="0 0 48 48"><rect x="11" y="9" width="10" height="30" rx="4" fill="#fff" stroke="#27324a" stroke-width="4"/><rect x="27" y="9" width="10" height="30" rx="4" fill="#fff" stroke="#27324a" stroke-width="4"/></symbol>
    <symbol id="i-play" viewBox="0 0 48 48"><path d="M15 8.5c0-2 2.2-3.2 3.9-2.1l21.2 15.5c1.4 1 1.4 3.2 0 4.2L18.9 41.6C17.2 42.7 15 41.5 15 39.5z" fill="#fff" stroke="#1d5c14" stroke-width="3" stroke-linejoin="round"/></symbol>
    <symbol id="i-shop" viewBox="0 0 48 48"><path d="M7 19h34l-3 21c-.3 1.7-1.7 3-3.4 3H13.4c-1.7 0-3.1-1.3-3.4-3z" fill="#fff" stroke="#5a3a00" stroke-width="4" stroke-linejoin="round"/><path d="M16 19v-4a8 8 0 0116 0v4" stroke="#5a3a00" stroke-width="4" fill="none"/><circle cx="24" cy="31" r="4" fill="#ffc21a"/></symbol>
    <symbol id="i-back" viewBox="0 0 48 48"><path d="M28 10L14 24l14 14" stroke="#27324a" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-retry" viewBox="0 0 48 48"><path d="M37 24a13 13 0 11-4-9.4" stroke="#27324a" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M36 6v11H25" stroke="#27324a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-home" viewBox="0 0 48 48"><path d="M7 23L24 8l17 15v17c0 1.7-1.3 3-3 3H10c-1.7 0-3-1.3-3-3z" fill="#fff" stroke="#27324a" stroke-width="4" stroke-linejoin="round"/><rect x="19" y="28" width="10" height="15" rx="2" fill="#27324a"/></symbol>
    <symbol id="i-lock" viewBox="0 0 48 48"><rect x="9" y="21" width="30" height="22" rx="5" fill="#ffd34d" stroke="#5a3a00" stroke-width="4"/><path d="M15 21v-5a9 9 0 0118 0v5" stroke="#5a3a00" stroke-width="5" fill="none"/><circle cx="24" cy="31" r="3.5" fill="#5a3a00"/></symbol>
    <symbol id="i-star" viewBox="0 0 48 48"><path d="M24 4l6 12.6 13.8 2-10 9.7 2.4 13.7L24 35.5l-12.2 6.5 2.4-13.7-10-9.7 13.8-2z" stroke-linejoin="round"/></symbol>
    <symbol id="i-next" viewBox="0 0 48 48"><path d="M10 24h26M26 12l12 12-12 12" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-portal" viewBox="0 0 48 48"><circle cx="24" cy="24" r="17" fill="#c8ff4a" stroke="#27324a" stroke-width="4"/><circle cx="24" cy="24" r="9" fill="#5a3a22" stroke="#27324a" stroke-width="3"/><circle cx="24" cy="24" r="3.5" fill="#fff8c0"/></symbol>
    <symbol id="i-trail" viewBox="0 0 48 48"><circle cx="10" cy="34" r="4" fill="#d8ff9a" stroke="#27324a" stroke-width="2.5"/><circle cx="21" cy="26" r="5.5" fill="#d8ff9a" stroke="#27324a" stroke-width="2.5"/><circle cx="35" cy="15" r="8" fill="#f4ffd0" stroke="#27324a" stroke-width="3"/></symbol>
    <symbol id="i-skip" viewBox="0 0 48 48"><path d="M8 10l16 14L8 38zM24 10l16 14-16 14z" fill="#fff" stroke="#27324a" stroke-width="3" stroke-linejoin="round"/></symbol>
    <symbol id="i-up" viewBox="0 0 48 48"><path d="M24 8L8 26h10v14h12V26h10z" fill="#fff" stroke="#27324a" stroke-width="3.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-down" viewBox="0 0 48 48"><path d="M24 42L8 22h10V8h12v14h10z" fill="#7fd4ff" stroke="#27324a" stroke-width="3.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-run" viewBox="0 0 48 48"><circle cx="29" cy="8" r="5" fill="#27324a"/><path d="M16 22l8-7 8 5 5 7M24 15l-3 13 8 6-2 10M21 28l-8 12" stroke="#27324a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-dance" viewBox="0 0 48 48"><path d="M30 6v22a6 6 0 11-4-5.6V10l14-4v7l-10 3" fill="#27324a"/><circle cx="12" cy="34" r="3" fill="#ff4fd8"/><circle cx="40" cy="30" r="2.5" fill="#36a2ff"/></symbol>
    <symbol id="i-flag" viewBox="0 0 48 48"><path d="M12 6v38" stroke="#27324a" stroke-width="5" stroke-linecap="round"/><path d="M14 8h24l-6 8 6 8H14z" fill="#3ddc5a" stroke="#27324a" stroke-width="3" stroke-linejoin="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="#3ddc5a" stroke="#27324a" stroke-width="4"/><path d="M14 25l7 7 13-15" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-miss" viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="#ff4d5e" stroke="#27324a" stroke-width="4"/><path d="M16 16l16 16M32 16L16 32" stroke="#fff" stroke-width="6" stroke-linecap="round"/></symbol>
    <symbol id="i-gift" viewBox="0 0 48 48"><rect x="7" y="20" width="34" height="22" rx="3" fill="#ff4fd8" stroke="#27324a" stroke-width="4"/><rect x="5" y="13" width="38" height="9" rx="3" fill="#ff8ae8" stroke="#27324a" stroke-width="4"/><path d="M24 13v29" stroke="#ffd22e" stroke-width="6"/><path d="M24 13c-4-8-13-8-12-2 1 4 8 3 12 2zM24 13c4-8 13-8 12-2-1 4-8 3-12 2z" fill="#ffd22e" stroke="#27324a" stroke-width="3" stroke-linejoin="round"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 48 48"><path d="M14 6h20v12a10 10 0 01-20 0z" fill="#ffcf2e" stroke="#8a5a00" stroke-width="3.5"/><path d="M14 10H7c0 7 3 10 7 10M34 10h7c0 7-3 10-7 10" stroke="#8a5a00" stroke-width="3.5" fill="none"/><path d="M20 28h8v7h-8zM14 36h20v6H14z" fill="#ffcf2e" stroke="#8a5a00" stroke-width="3.5" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div id="loading" class="screen show">
  <div class="load-box">
    <div class="logo small"><span class="l1">Gökyüzü</span><span class="l2">Parkuru</span></div>
    <div class="load-bar"><i id="loadFill"></i></div>
    <div class="load-text">Yükleniyor…</div>
  </div>
</div>

<div id="menu" class="screen">
  <div class="menu-top">
    <a class="chip-btn back-link" href="../../index.html"><svg><use href="#i-back"/></svg><span>Oyunlar</span></a>
    <div class="wallet pill"><svg class="ico"><use href="#i-coin"/></svg><b id="walletCoins">0</b></div>
    <button class="round-btn" data-action="mute" aria-label="Ses"><svg><use href="#i-sound"/></svg></button>
  </div>
  <div class="menu-left">
    <div class="logo"><span class="l1">Gökyüzü</span><span class="l2">Parkuru</span></div>
    <div class="worlds" id="worldCards"></div>
    <div class="star-road" id="starRoad"></div>
    <div class="menu-actions">
      <button id="playBtn" class="btn btn-green btn-huge"><svg><use href="#i-play"/></svg><span>OYNA</span></button>
      <button id="shopBtn" class="btn btn-yellow btn-big"><svg><use href="#i-shop"/></svg><span>Mağaza</span></button>
    </div>
  </div>
</div>

<div id="hud" class="hidden">
  <div class="hud-left">
    <div class="pill coin-pill"><svg class="ico"><use href="#i-coin"/></svg><b id="hudCoins">0</b><small id="hudCoinsMax">/0</small></div>
    <div class="pill small-pill star-pill hidden" id="starPill"><svg class="ico"><use href="#i-star"/></svg><b id="hudStars">0</b><small id="hudStarsMax">/0</small></div>
  </div>
  <div class="hud-center">
    <div class="stage-label" id="stageLabel"><svg class="ico"><use href="#i-flag"/></svg><b id="stageNum">1</b>/<span id="stageMax">10</span></div>
  </div>
  <div class="hud-right">
    <button class="round-btn" data-action="mute" aria-label="Ses"><svg><use href="#i-sound"/></svg></button>
    <button class="round-btn" data-action="pause" aria-label="Durdur"><svg><use href="#i-pause"/></svg></button>
  </div>
  <div class="tower" id="tower"><div class="tower-track" id="towerTrack"></div><div class="tower-head" id="towerHead"></div></div>
  <button class="btn btn-blue skip-btn hidden" id="skipBtn"><svg><use href="#i-skip"/></svg><span>Geç</span></button>
  <div class="hint" id="hint"></div>
</div>

<div id="toast"></div>
<div id="fallMsg"><svg class="ico"><use href="#i-down"/></svg><span>Düştün!</span></div>
<div id="flyNum"></div>
<div id="flyCoin"></div>
<div id="banner"><span id="bannerText"></span></div>

<div id="touch" class="hidden">
  <div class="joy" id="joy"><div class="joy-knob" id="joyKnob"></div></div>
  <button class="jump-btn" id="jumpBtn" aria-label="Zıpla"><svg><use href="#i-up"/></svg></button>
</div>

<div id="pause" class="screen modal">
  <div class="card">
    <h2>Mola</h2>
    <button class="btn btn-green btn-big" data-action="resume"><svg><use href="#i-play"/></svg><span>Devam</span></button>
    <div class="row">
      <button class="btn btn-white" data-action="restart"><svg><use href="#i-retry"/></svg><span>Baştan</span></button>
      <button class="btn btn-white" data-action="menu"><svg><use href="#i-home"/></svg><span>Menü</span></button>
    </div>
    <div class="keys-help">
      <div class="key arrows"><div class="kb-row"><kbd>↑</kbd></div><div class="kb-row"><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd></div></div>
      <div class="key wasd"><div class="kb-row"><kbd>W</kbd></div><div class="kb-row"><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></div></div>
      <div class="key space"><kbd class="wide">␣</kbd><svg class="ico"><use href="#i-up"/></svg></div>
      <div class="key"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><svg class="ico"><use href="#i-dance"/></svg></div>
    </div>
    <a class="chip-btn back-link" href="../../index.html"><svg><use href="#i-back"/></svg><span>Oyunlar</span></a>
  </div>
</div>

<div id="results" class="screen modal">
  <div class="card result-card">
    <div class="result-trophy"><svg><use href="#i-trophy"/></svg></div>
    <h2>Tebrikler!</h2>
    <div class="stars" id="resStars">
      <div class="star-col"><svg class="star"><use href="#i-star"/></svg><div class="goal" id="goalFinish"><svg class="ico"><use href="#i-flag"/></svg><svg class="mark"><use href="#i-check"/></svg></div></div>
      <div class="star-col"><svg class="star"><use href="#i-star"/></svg><div class="goal" id="goalBonus"><svg class="ico bonus-ico"><use href="#i-star"/></svg><b id="goalBonusN">0/0</b><svg class="mark"><use href="#i-check"/></svg></div></div>
      <div class="star-col"><svg class="star"><use href="#i-star"/></svg><div class="goal" id="goalPar"><svg class="ico"><use href="#i-clock"/></svg><b id="goalParT">1:30</b><svg class="mark"><use href="#i-check"/></svg></div></div>
    </div>
    <div class="pill reward-pill hidden" id="resReward"><svg class="ico"><use href="#i-gift"/></svg><svg class="ico"><use href="#i-coin"/></svg><b id="resRewardN">+50</b></div>
    <div class="res-rows">
      <div class="res-row"><svg class="ico"><use href="#i-clock"/></svg><span>Süre</span><b id="resTime">0:00</b></div>
      <div class="res-row"><svg class="ico"><use href="#i-coin"/></svg><span>Altın</span><b id="resCoins">0</b></div>
      <div class="res-row secret hidden" id="resSecretRow"><svg class="ico"><use href="#i-portal"/></svg><span>Gizli</span><b id="resSecret">0</b></div>
      <div class="res-row"><svg class="ico"><use href="#i-skull"/></svg><span>Düşme</span><b id="resDeaths">0</b></div>
    </div>
    <div class="res-extra">
      <div class="record hidden" id="resRecord">Yeni rekor!</div>
      <div class="pill gift-pill hidden" id="resGift"><svg class="ico"><use href="#i-gift"/></svg><span id="resGiftT"></span></div>
    </div>
    <div class="res-best" id="resBest"></div>
    <div class="row">
      <button class="btn btn-white" data-action="restart"><svg><use href="#i-retry"/></svg><span>Tekrar</span></button>
      <button class="btn btn-white" data-action="menu"><svg><use href="#i-home"/></svg><span>Menü</span></button>
    </div>
    <button class="btn btn-green btn-big hidden" id="nextWorldBtn" data-action="next"><span>Sonraki dünya</span><svg><use href="#i-next"/></svg></button>
  </div>
</div>

<div id="shop" class="screen">
  <div class="shop-top">
    <button class="round-btn big-x" data-action="closeShop" aria-label="Geri"><svg><use href="#i-back"/></svg></button>
    <div class="shop-title">Mağaza</div>
    <div class="wallet pill"><svg class="ico"><use href="#i-coin"/></svg><b id="shopCoins">0</b></div>
  </div>
  <div class="shop-panel">
    <div class="tabs">
      <button class="tab active" data-tab="color">Renkler</button>
      <button class="tab" data-tab="trail">İzler</button>
    </div>
    <div class="shop-grid" id="shopGrid"></div>
    <button class="btn btn-green btn-big shop-buy" id="shopBuy"><span>Seç</span></button>
  </div>
</div>

<div id="fade"><svg class="fade-ico"><use href="#i-portal"/></svg></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
